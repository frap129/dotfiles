# Theme - Colors, Gaps, Borders

# Gaps 
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10

# Borders 
border_px=0
border_radius=8

# Colors (0xRRGGBBAA format)
focus_color=0x33ccffee
border_color=0x595959aa
root_color=0x201b14ff

# Cursor
cursor_size=24

# Window effects 
# Blur 
blur=1
blur_params_num_passes=2
blur_params_radius=3

# Shadows 
shadows=0

# Opacity
focused_opacity=0.98
unfocused_opacity=0.91

# Animation
animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
animation_duration_open=200
animation_duration_close=200
animation_duration_tag=200
animation_curve_open=0.65,0.05,0.36,1
animation_curve_close=0.65,0.05,0.36,1
animation_curve_tag=0.65,0.05,0.36,1
