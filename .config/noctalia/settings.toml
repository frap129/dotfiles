config_version = 14

[audio]
enable_sounds = true

[bar.default]
center = ["clock"]
end = [
  "tray",
  "clipboard",
  "notifications",
  "network",
  "bluetooth",
  "widget",
  "battery",
  "control-center"
]
margin_edge = 0.0
margin_ends = 0
padding = 12
radius_top_left = 0
radius_top_right = 0
start = ["btn", "workspaces", "caffeine", "active_window"]
thickness = 28
widget_spacing = 8

[brightness]
enable_ddcutil = true

[desktop_widgets]
enabled = false

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 900.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660.0

[location]
address = "Detroit, US"

[lockscreen]
transition = ["disc", "fade", "honeycomb", "stripes", "wipe", "zoom"]
transition_duration = 1000

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
  "lockscreen-login-box@DP-3",
  "lockscreen-login-box@eDP-1",
  "lockscreen-widget-0000000000000002",
  "lockscreen-widget-0000000000000003",
  "lockscreen-widget-0000000000000004",
  "lockscreen-widget-0000000000000005"
]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
