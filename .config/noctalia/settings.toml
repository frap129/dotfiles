[notification]
layer = "overlay"

[plugin_settings."davemhammer/obsidian"]
daily_folder = "Daily/"
manager_open_near_click = false
manager_placement = "attached"
refresh_interval = 300
vault_path = "/home/joe/ObsidianNotes"

[plugin_settings."ezequiel/mango_layouts"]
panel_open_near_click = true
panel_placement = "attached"

[plugin_settings."frap129/noctalia-bitwarden-keyring"]
unlock_placement = "attached"

[plugins]
enabled = [
  "whyoolw/sharednd",
  "nightwatch75/todo",
  "noctalia/bitwarden",
  "frap129/noctalia-bitwarden-keyring",
  "ezequiel/mango_layouts",
  "blackbartblues/audio-switcher",
]

[[plugins.source]]
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[[plugins.source]]
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"

[[plugins.source]]
kind = "path"
location = "/home/joe/software/bitwarden-keyring/"
name = "bitwarden-keyring-local"

[[plugins.source]]
kind = "path"
location = "/home/joe/software/bitwarden-keyring"
name = "bitwarden-keyring"

[shell]
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true
telemetry_enabled = false

[shell.panel]
borders = false
clipboard_placement = "attached"
launcher_placement = "attached"
open_near_click_clipboard = true
open_near_click_control_center = true
shadow = false
transparency_mode = "soft"

[system.monitor]
enabled = false

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

[theme.templates]
builtin_ids = ["btop", "gtk3", "gtk4", "kcolorscheme", "mango", "qt"]
community_ids = ["pi_agent", "pi-agent", "pywalfox", "vscode"]

[weather]
unit = "imperial"

[widget.active_window]
max_length = 800

[widget.battery]
show_label = false

[widget.btn]
type = "ezequiel/mango_layouts:btn"

[widget.clock]
anchor = true
format = "{:%I:%M %p - %A, %B %e}"

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.widget]
type = "blackbartblues/audio-switcher:widget"

