defaultPref("webgl.disabled", false);
defaultPref("privacy.clearOnShutdown.history", false);
defaultPref("privacy.clearOnShutdown.downloads", false);
defaultPref("privacy.clearOnShutdown.cookies", false);
defaultPref("privacy.clearOnShutdown.formdata", false);
pref("privacy.resistFingerprinting", true);
pref("widget.wayland.fractional-scale.enabled", true);
pref("gfx.webrender.all", true);
pref("gfx.webrender.quality.force-subpixel-aa-where-possible", true);

/** GFX ***/
pref("gfx.canvas.accelerated.cache-size", 512);
pref("gfx.content.skia-font-cache-size", 20);
pref("gfx.webrender.layer-compositor", true);

/** MEMORY CACHE ***/
pref("browser.sessionhistory.max_total_viewers", 4);

/** MEDIA CACHE ***/
pref("media.cache_readahead_limit", 7200);
pref("media.cache_resume_threshold", 3600);

/** IMAGE CACHE ***/
pref("image.mem.decode_bytes_at_a_time", 32768);

/** NETWORK ***/
pref("network.http.max-connections", 1800);
pref("network.http.max-persistent-connections-per-server", 10);
pref("network.http.max-urgent-start-excessive-connections-per-host", 5);
pref("network.http.pacing.requests.enabled", false);
pref("network.dnsCacheExpiration", 3600);
pref("network.ssl_tokens_cache_capacity", 10240);
